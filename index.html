<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 34rem; margin: 12vh auto; padding: 0 1rem; }
  .row { display: flex; gap: .5rem; margin: 1rem 0; }
  input, button { font: inherit; padding: .6rem; }
  #length { width: 5rem; }
  #password { min-width: 0; flex: 1; }
  button { cursor: pointer; }
  #status { min-height: 1.5em; }
</style>
</head>
<body>
<h1>Password Generator</h1>
<label>文字数 <input id="length" type="number" min="8" max="128" value="24"></label>
<label><input id="symbols" type="checkbox" checked> 記号を候補に含める</label>
<div class="row">
  <input id="password" type="text" aria-label="生成されたパスワード" readonly spellcheck="false">
  <button id="copy" type="button">コピー</button>
</div>
<button id="generate" type="button">生成</button>
<p id="status" role="status"></p>
<script>
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const symbols = '!@#$%^&*()-_=+[]{}:,.?';
const lengthInput = document.querySelector('#length');
const password = document.querySelector('#password');
const status = document.querySelector('#status');

function generate() {
  const length = Number(lengthInput.value);
  if (!Number.isInteger(length) || length < 8 || length > 128) {
    status.textContent = '文字数は8〜128で指定してください。';
    return;
  }
  const chars = letters + (document.querySelector('#symbols').checked ? symbols : '');
  const random = new Uint8Array(1);
  const limit = Math.floor(256 / chars.length) * chars.length;
  let result = '';
  while (result.length < length) {
    crypto.getRandomValues(random);
    if (random[0] < limit) result += chars[random[0] % chars.length];
  }
  password.value = result;
  status.textContent = '';
}

document.querySelector('#generate').addEventListener('click', generate);
document.querySelector('#symbols').addEventListener('change', generate);
document.querySelector('#copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(password.value);
    status.textContent = 'コピーしました。';
  } catch {
    password.select();
    status.textContent = 'コピーできませんでした。選択した文字列を手動でコピーしてください。';
  }
});
generate();
</script>
</body>
</html>
